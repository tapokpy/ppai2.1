# Production stack for ppai.
#
# VPN split-tunneling: only outbound calls to the Anthropic (Claude) API are
# routed through the `gluetun` container's HTTP proxy, which tunnels through
# a self-hosted WireGuard server (e.g. deployed via AmneziaVPN, using its
# plain "WireGuard" protocol — NOT the obfuscated "AmneziaWG" variant, which
# Gluetun's standard WireGuard implementation cannot speak).
# Telegram, Postgres, Redis and Ollama traffic all stay on the plain Docker
# bridge network and never touch the VPN — this avoids Telegram flagging the
# bot for using a datacenter/VPN exit IP, and keeps local DB/cache calls
# fast. See the deployment notes for the full rationale and a request-by-
# request walkthrough of the Claude path.
#
# Usage:
#   cp .env.example .env            # fill in secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Required additional variables (put them in .env, do not commit them).
# Get the WireGuard values from the config AmneziaVPN generated for this
# device (Amnezia app -> your server -> "..." -> share/export config):
#   POSTGRES_PASSWORD
#   VPN_ENDPOINT_IP            = your server's IP (the [Peer] Endpoint host)
#   VPN_ENDPOINT_PORT          = the [Peer] Endpoint port (default 51820)
#   VPN_SERVER_PUBLIC_KEY      = [Peer] PublicKey in the exported config
#   VPN_CLIENT_PRIVATE_KEY     = [Interface] PrivateKey in the exported config
#   VPN_CLIENT_ADDRESS         = [Interface] Address in the exported config (e.g. 10.8.1.2/32)
#   VPN_PRESHARED_KEY          = [Peer] PresharedKey, only if Amnezia set one (optional)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ppai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ppai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ppai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # VPN sidecar. Exposes an HTTP proxy on :8888 *inside* the Docker network
  # only (no host port published) that tunnels through your own WireGuard
  # server. Nothing is attached to it via network_mode — api/bot reach it as
  # a regular proxy target (see ANTHROPIC_PROXY_URL below), so if the tunnel
  # drops, only Claude calls fail; Telegram/DB/Redis keep working.
  gluetun:
    image: qmcgaw/gluetun:latest
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      WIREGUARD_ENDPOINT_IP: ${VPN_ENDPOINT_IP:?required}
      WIREGUARD_ENDPOINT_PORT: ${VPN_ENDPOINT_PORT:-51820}
      WIREGUARD_PUBLIC_KEY: ${VPN_SERVER_PUBLIC_KEY:?required}
      WIREGUARD_PRIVATE_KEY: ${VPN_CLIENT_PRIVATE_KEY:?required}
      WIREGUARD_ADDRESSES: ${VPN_CLIENT_ADDRESS:?required}
      WIREGUARD_PRESHARED_KEY: ${VPN_PRESHARED_KEY:-}
      HTTPPROXY: "on"
      HTTPPROXY_LISTENING_ADDRESS: ":8888"
      BLOCK_IPV6: "on"
      DOT: "off"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--timeout=3", "http://localhost:8888"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      # Only Claude calls go through gluetun's proxy; every other outbound
      # call this service makes (Postgres, Redis, Ollama) bypasses it.
      ANTHROPIC_PROXY_URL: http://gluetun:8888
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-ppai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ppai}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
      CHROMA_PERSIST_DIR: /app/data/chroma_db
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file: .env
    environment:
      ANTHROPIC_PROXY_URL: http://gluetun:8888
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-ppai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ppai}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
      CHROMA_PERSIST_DIR: /app/data/chroma_db
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gluetun:
        condition: service_healthy
    restart: unless-stopped
    # Telegram Bot API calls are NOT proxied through gluetun — the bot talks
    # out directly on the plain bridge network so Telegram sees the real
    # server IP, not the VPN exit IP (avoids the datacenter/VPN-IP ban risk).

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    environment:
      WEBUI_AUTH: "false"
      OPENAI_API_BASE_URL: http://api:8000/api/v1
    volumes:
      - open_webui_data:/app/backend/data
    ports:
      - "3000:8080"
    depends_on:
      - api
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:latest
    command: -H unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "9443:9443"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  app_data:
  open_webui_data:
  portainer_data:
