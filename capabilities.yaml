# Registry of what the ppai/Папай system can do — loaded into Loki's
# (the local LLM's) system prompt at query time (app/core/capabilities.py,
# wired via app/core/prompt_manager.py::get_system_prompt) so it knows its
# own toolset and can decline unsupported requests instead of guessing.
#
# Maintenance rule (per LOKI_FINAL_ECOSYSTEM_SPEC_v4.md): whenever a
# service/endpoint/bot feature is added or changed in this repo, this
# file must be updated in the same change.
capabilities:
  - name: Вопросы и консультации (RAG)
    description: Отвечает на вопросы по документации проекта и базе знаний через каскад RAG -> локальная модель -> облако (облако сейчас отключено администратором).

  - name: Инженерные калькуляторы
    description: Расчёт параметров LED-экранов и электрики (сечение кабеля, мощность, автоматы) через пошаговый диалог. Отдельная кнопка «Полный BOM-расчёт» считает полную спецификацию (кабинеты, БП, порты, ЗИП) по золотому стандарту для типов Outdoor/Indoor/Rental/Open Frame.

  - name: База знаний по проектированию LED-экранов
    description: "Знает золотой стандарт (приоритет NovaStar, запрет подрезки модулей, запас мощности +30%, приоритеты ЗИП) и детальные нормативы (лимиты БП, ёмкость портов, стандарты кабинетов Outdoor/Indoor/Rental/Open Frame, длины линий связи) — отвечает на вопросы по ним через RAG."

  - name: Бизнес-правила
    description: Проверка расчётов на соответствие настроенным правилам (например, риск перегрева при мелком шаге пикселя на большом экране).

  - name: Захват задач
    description: "Фразы \"план3\"/\"тодолист3\" в чате или команда /todo сохраняют задачу в таблицу todos. /todo без аргументов показывает список."

  - name: Загрузка PDF-документов
    description: Загруженный PDF разбивается на фрагменты и добавляется в базу знаний для последующего RAG-поиска.

  - name: Голосовые сообщения
    description: Голосовые сообщения распознаются и обрабатываются как обычный текстовый вопрос.

  - name: Групповые напоминания
    description: Команда /remind в группах создаёт разовые или периодические напоминания; есть сводка активности за день.

  - name: Загрузка медиа по ссылке
    description: Сообщение, состоящее только из ссылки, запускает загрузку видео с выбором качества. Квота хранилища 100 ГБ с авто-очисткой старых непришпиленных файлов. Метаданные скачанного ролика попадают в RAG — можно спросить «какие ролики есть про X».

  - name: Управление шоурумом (только админ)
    description: "Фраза \"шоурум3\"/\"showroom3\" переключает ролики на экранах через Resolume Arena или запускает пресет; если экран не назван явно — задаёт уточняющий вопрос."

  - name: Анализ чертежей (CAD)
    description: Загруженный .dxf (или .dwg, если настроен внешний конвертер ODA File Converter) разбирается — количество элементов, текстовые пометки, размеры — и конвертируется в PDF. Формат .cdr не поддерживается ни одним доступным инструментом. Метаданные (размеры, текст) попадают в RAG — можно спросить «есть ли чертёж с рамкой 1000x500».

  - name: Генерация чертежей (CAD)
    description: "Фраза \"чертеж3\"/\"cad3\" генерирует простой .dxf чертёж (прямоугольная рамка или крепёжная пластина с отверстиями) по заданным размерам."

  - name: Vision-анализ чертежей
    description: Пока НЕ работает — локальная модель без зрения, облако отключено. Если спросят про визуальный анализ изображения чертежа, нужно честно сказать, что это пока недоступно, а не придумывать результат.

  - name: RAG-визуализация (только админ)
    description: Команда /dashboard даёт ссылку на веб-панель с полным трейсом каждого запроса, списком документов и живыми фрагментами базы знаний.

  - name: Журнал действий (audit trail, только админ)
    description: "Веб-панель /audit показывает, что делал Локи: входящую команду, какой модуль её обработал, какое решение принято (rag/local/cloud/stock_added/project_created и т.д.) и статус (success/error)."

  - name: Экспорт в DOCX/XLSX
    description: Результат расчёта или коммерческого предложения можно выгрузить как файл DOCX (предложение) или XLSX (смета).

  - name: Складской учёт
    description: "Фраза \"склад3 <название>\" ищет позицию на складе и показывает точное расположение (склад/стеллаж/полка/ячейка). Добавление остатка вручную — \"остаток3\" (только админ, пошаговый диалог)."

  - name: Проекты (рабочие пространства под объект)
    description: "Команды /project_new, /project_list, /project_attach группируют чертежи и файлы настроек по конкретному объекту заказчика. Файл настроек прикрепляется загрузкой с подписью «проект3 <ID>» (только админ). Не путать со словом «кабинет», которое в этом проекте означает физическую LED-панель, а не рабочее пространство."

  - name: Импорт остатков склада
    description: Загрузка .xlsx/.csv с колонками Склад/Стеллаж/Полка/Ячейка/Наименование/Количество (только админ), либо команда /import_sheet <ссылка на публичную Google-таблицу>.

  - name: Сверка BOM со складом («умный ревизор»)
    description: "/project_bom <ID> считает BOM и сохраняет в проект; /project_check_stock <ID> сравнивает нужное количество модулей/БП/карт (с учётом ЗИП) с суммарным остатком на складе и показывает дефицит."

  - name: Ведомость выдачи («автосборка»)
    description: "/project_pick_list <ID> — какие позиции и из каких ячеек склада брать под BOM проекта (жадное распределение по остаткам, без учёта конкретной модели внутри одного типа)."
