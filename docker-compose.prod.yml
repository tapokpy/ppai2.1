# Production stack for ppai.
#
# VPN split-tunneling is NOT enabled by default right now — the `gluetun`
# service below is defined but not started unless you explicitly opt in
# (see "VPN (optional, currently disabled)" further down). Without it, the
# `api`/`bot` containers call the Anthropic API directly, same as running
# them outside Docker. Telegram, Postgres, Redis and Ollama traffic never
# goes through gluetun even when it's enabled — only Claude calls would.
#
# Usage:
#   cp .env.example .env            # fill in secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Required variables (put them in .env, do not commit it):
#   POSTGRES_PASSWORD

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ppai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-ppai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ppai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    # GPU passthrough (NVIDIA). Falls back to CPU automatically if no GPU is
    # present at deploy time, but a CPU-only 7B model is dramatically slower
    # (observed: 100+ seconds per response vs. low single digits on GPU) —
    # verified live that this host has an RTX 3060 and the nvidia container
    # runtime already installed, just never wired up here.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file: .env
    environment:
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-ppai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ppai}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
      CHROMA_PERSIST_DIR: /app/data/chroma_db
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    env_file: .env
    environment:
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-ppai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ppai}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
      CHROMA_PERSIST_DIR: /app/data/chroma_db
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    environment:
      WEBUI_AUTH: "false"
      OPENAI_API_BASE_URL: http://api:8000/api/v1
    volumes:
      - open_webui_data:/app/backend/data
    ports:
      - "3000:8080"
    depends_on:
      - api
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:latest
    command: -H unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    ports:
      - "9443:9443"
    restart: unless-stopped

  # --- VPN (optional, currently disabled) -----------------------------
  # Not part of the default `docker compose up`. To use it once a
  # Gluetun-compatible (plain WireGuard, not AmneziaWG) VPN endpoint is
  # ready: start it with `docker compose --profile vpn up -d gluetun`,
  # fill in the VPN_* variables below in .env, and add
  # `ANTHROPIC_PROXY_URL: http://gluetun:8888` plus
  # `depends_on: gluetun: condition: service_healthy` back onto the
  # `api` and `bot` services above.
  gluetun:
    image: qmcgaw/gluetun:latest
    profiles: ["vpn"]
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: custom
      VPN_TYPE: wireguard
      WIREGUARD_ENDPOINT_IP: ${VPN_ENDPOINT_IP:-}
      WIREGUARD_ENDPOINT_PORT: ${VPN_ENDPOINT_PORT:-51820}
      WIREGUARD_PUBLIC_KEY: ${VPN_SERVER_PUBLIC_KEY:-}
      WIREGUARD_PRIVATE_KEY: ${VPN_CLIENT_PRIVATE_KEY:-}
      WIREGUARD_ADDRESSES: ${VPN_CLIENT_ADDRESS:-}
      WIREGUARD_PRESHARED_KEY: ${VPN_PRESHARED_KEY:-}
      HTTPPROXY: "on"
      HTTPPROXY_LISTENING_ADDRESS: ":8888"
      BLOCK_IPV6: "on"
      DOT: "off"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--timeout=3", "http://localhost:8888"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  app_data:
  open_webui_data:
  portainer_data:
